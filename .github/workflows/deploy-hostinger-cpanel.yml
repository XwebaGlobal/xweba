name: Deploy to Hostinger / cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 🔍 Verify build output
        run: |
          ls -la dist/
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          test -f dist/.htaccess || { echo "dist/.htaccess missing!"; exit 1; }

      - name: 🚀 Deploy to Hostinger / cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
